<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <title>SML : 익명 우체통</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=KoPub+Batang:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mailbox.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Mobile Sticky Header -->
    <header class="mobile-header lg:hidden">
        <div class="header-left">
            <button id="menuToggleBtnMobile"
                class="p-2 text-brand-primary hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors flex items-center justify-center lg:hidden"
                aria-label="Menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="mobile-logo ml-2 font-serif font-bold text-brand-primary tracking-tight">
                <a href="index.html">SMALLSM</a>
            </div>
        </div>
        <div class="header-right">
            <button id="headerModeToggle"
                class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Global Floating Menu Button (for Desktop) -->
    <button id="menuToggleBtn"
        class="fixed top-3 left-3 z-[10001] p-3 text-brand-primary hover:scale-110 active:scale-95 transition-all hidden lg:flex items-center justify-center bg-white/10 backdrop-blur-md rounded-full border border-white/10 shadow-lg gap-2"
        aria-label="Menu">
        <i data-lucide="menu" class="block w-6 h-6" style="stroke-width: 2.5px;"></i>
        <span class="text-[10px] font-bold tracking-tighter hidden xl:block">MENU</span>
    </button>

    <!-- Sidebar / Drawer -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 z-[10000] bg-white dark:bg-black border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-300 ease-in-out hidden lg:static lg:translate-x-0 lg:flex">
        <div class="h-full flex flex-col p-6">
            <h1 class="text-2xl font-bold font-serif text-brand-primary mb-8">SMALLSM</h1>
            <nav class="flex-1 overflow-y-auto">
                <ul class="space-y-1 mb-8">
                    <li class="nav-item">
                        <a href="index.html"
                            class="w-full flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-lg transition-colors">
                            <i data-lucide="home" class="w-5 h-5"></i>
                            <span class="font-medium">Archive Home</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="mailbox.html"
                            class="w-full flex items-center gap-3 px-4 py-3 text-brand-primary bg-brand-primary/10 rounded-lg transition-colors">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                            <span class="font-medium">Small Talk</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <button
                            class="w-full flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-lg transition-colors text-left btn-settings">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span class="font-medium">Settings</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Scrim-like Overlay for Menu -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[9998] hidden opacity-0 transition-opacity duration-300">
    </div>

    <div class="app-container content-blur max-w-screen-xl mx-auto pt-2 pb-8 px-4 md:px-6" id="appContainer">

        <!-- Main Content -->
        <main class="main-content" style="padding-top: 1rem;">
            <div class="mailbox-container">
                <header class="mailbox-header" style="margin-bottom: 1.5rem;">
                    <h1 class="mailbox-title">📬 익명 우체통</h1>
                    <p class="mailbox-subtitle">
                        하고 싶은 말이 있지만, 누구에게도 할 수 없었던 이야기.<br>
                        이곳에 남겨주시면 관리자가 천천히 읽고 답해드립니다.
                    </p>
                </header>

                <!-- Tabs -->
                <div class="mailbox-tabs">
                    <button class="tab-btn active" onclick="switchTab('write')">편지 쓰기</button>
                    <button class="tab-btn" onclick="switchTab('view')">답변 보기</button>
                </div>

                <!-- Tab Content: Write -->
                <section id="tab-write" class="tab-content active">
                    <div class="write-card">
                        <div class="form-group">
                            <label>보내는 이 (선택)</label>
                            <input type="text" id="senderNickname" class="mailbox-input" placeholder="익명 (또는 별명)">
                        </div>

                        <div class="form-group">
                            <label>고민 내용</label>
                            <textarea id="messageContent" class="mailbox-textarea"
                                placeholder="당신의 이야기를 들려주세요. 개인정보가 포함되지 않도록 주의해주세요."></textarea>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="allowPublic">
                                <span>공개 답변 허용 (다른 사람들도 내 고민과 답변을 볼 수 있습니다)</span>
                            </label>
                            <!-- Password for future edit/delete feature -->
                            <div class="password-group">
                                <span class="lock-icon">🔒</span>
                                <input type="password" id="msgPassword" class="mailbox-input-sm"
                                    placeholder="비밀번호 (수정/삭제용)" maxlength="20">
                            </div>
                        </div>

                        <button class="btn-send" onclick="submitMessage()">우표 붙여 보내기 📮</button>
                    </div>
                </section>

                <!-- Tab Content: View -->
                <section id="tab-view" class="tab-content">
                    <div id="publicMessageList" class="message-list">
                        <!-- Loaded Dynamically -->
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>우체통을 확인하고 있습니다...</p>
                        </div>
                    </div>

                    <!-- Detail Modal -->
                    <div id="messageModal" class="message-modal">
                        <div class="modal-content">
                            <span class="close-modal">&times;</span>
                            <div class="modal-header">
                                <span class="modal-nickname" id="modalNickname">익명</span>
                                <span class="modal-date" id="modalDate">2024.01.01</span>
                            </div>
                            <div class="modal-body">
                                <p id="modalQuestion" class="question-text"></p>
                                <div class="admin-reply-box">
                                    <div class="reply-header">
                                        <span class="reply-icon">💌</span> 답장
                                    </div>
                                    <p id="modalAnswer" class="answer-text"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <footer class="site-footer py-4 mt-4">
                <p id="copyrightText" class="text-xs opacity-50 text-center">© 2026 - PRESENT SMALLSM. All Rights
                    Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config" async></script>
    <script src="js/mailbox.js"></script>
</body>

</html>
