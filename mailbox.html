<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <title>SML : 익명 우체통</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=KoPub+Batang:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mailbox.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Core Logic (Supabase, Age Gate, Dark Mode) -->
    <script src="js/core.js"></script>
</head>

<body>
    <!-- Mobile Sticky Header -->
    <header class="mobile-header lg:hidden">
        <div class="header-left">
            <button id="menuToggleBtnMobile"
                class="p-2 text-brand-primary hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors flex items-center justify-center lg:hidden"
                aria-label="Menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="mobile-logo ml-2 font-serif font-bold text-brand-primary tracking-tight">
                <a href="index.html">SMALLSM</a>
            </div>
        </div>
        <div class="header-right">
            <button id="headerModeToggle"
                class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Global Floating Menu Button (for Desktop) -->
    <button id="menuToggleBtn"
        class="fixed top-3 left-3 z-[10001] p-3 text-brand-primary hover:scale-110 active:scale-95 transition-all hidden lg:flex items-center justify-center bg-white/10 backdrop-blur-md rounded-full border border-white/10 shadow-lg gap-2"
        aria-label="Menu">
        <i data-lucide="menu" class="block w-6 h-6" style="stroke-width: 2.5px;"></i>
        <span class="text-[10px] font-bold tracking-tighter hidden xl:block">MENU</span>
    </button>

    <!-- Sidebar / Drawer -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 z-[10000] bg-white dark:bg-black border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-300 ease-in-out hidden lg:static lg:translate-x-0 lg:flex">
        <div class="h-full flex flex-col p-6">
            <h1 class="text-2xl font-bold font-serif text-brand-primary mb-8">
                <a href="index.html">SMALLSM</a>
            </h1>
            <div class="relative mb-4">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchInput"
                    class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg pl-10 pr-4 py-3 text-sm"
                    placeholder="Search archive...">
            </div>
            <nav class="flex-1 overflow-y-auto">
                <ul id="categoryNav" class="space-y-1 mb-8">
                    <!-- Loaded dynamically -->
                </ul>
                <div class="pt-6 border-t border-slate-200 dark:border-slate-800 space-y-2">
                    <button id="sidebarSettingsBtn"
                        class="w-full flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-lg transition-colors text-left btn-settings">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span class="font-medium">설정 (Settings)</span>
                    </button>
                    <!-- Legacy Mailbox Items if needed back, but categories are better -->
                </div>
            </nav>
        </div>
    </aside>

    <!-- Scrim-like Overlay for Menu -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[9998] hidden opacity-0 transition-opacity duration-300">
    </div>

    <div id="appContainer" class="max-w-screen-xl mx-auto pt-2 pb-8 px-4 md:px-6">
        <!-- Wiki Mode Container (3-Column) -->
        <div id="wikiContainer">
            <div class="wiki-layout">
                <aside class="wiki-nav-col" id="wikiNavCol">
                    <div class="wiki-nav-header mb-6">
                        <h2 class="text-xs font-bold text-slate-500 tracking-[0.2em] uppercase mb-4 font-mono">Terminal
                            Navigation</h2>
                    </div>
                    <ul id="categoryNav" class="wiki-nav-list space-y-1">
                        <!-- Loaded dynamically -->
                    </ul>
                </aside>

                <main class="wiki-content-col" id="wikiContentCol">
                    <header class="wiki-post-header mb-10">
                        <div class="text-[var(--wiki-gold)] text-[10px] font-mono tracking-[0.3em] uppercase mb-2">
                            Anonymous Terminal</div>
                        <h1 class="text-4xl md:text-5xl font-bold font-serif text-white mb-4 border-none !p-0">익명 우체통
                        </h1>
                        <p class="text-[var(--wiki-text-dim)] italic mb-6">하고 싶은 말이 있지만, 누구에게도 할 수 없었던 이야기. 이곳에 남겨주시면
                            관리자가 천천히 읽고 답해드립니다.</p>
                        <div class="h-1 w-20 bg-[var(--wiki-gold)]"></div>
                    </header>

                    <div class="mailbox-container">
                        <!-- Tabs inside Wiki Content -->
                        <div class="mailbox-tabs mb-8">
                            <button class="tab-btn active" onclick="switchTab('write')">편지 쓰기</button>
                            <button class="tab-btn" onclick="switchTab('view')">답변 보기</button>
                        </div>

                        <!-- Tab Content: Write -->
                        <section id="tab-write" class="tab-content active">
                            <div class="write-card p-6 bg-white/5 border border-white/10 rounded-xl">
                                <div class="form-group mb-4">
                                    <label
                                        class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-mono">보내는
                                        이 (선택)</label>
                                    <input type="text" id="senderNickname"
                                        class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-[var(--wiki-gold)]"
                                        placeholder="익명 (또는 별명)">
                                </div>

                                <div class="form-group mb-4">
                                    <label
                                        class="block text-[10px] uppercase tracking-widest text-slate-500 mb-2 font-mono">고민
                                        내용</label>
                                    <textarea id="messageContent"
                                        class="w-full h-40 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-[var(--wiki-gold)] resize-none"
                                        placeholder="당신의 이야기를 들려주세요. 개인정보가 포함되지 않도록 주의해주세요."></textarea>
                                </div>

                                <div class="form-options space-y-4 mb-6">
                                    <label class="flex items-center gap-3 cursor-pointer">
                                        <input type="checkbox" id="allowPublic" class="accent-[var(--wiki-gold)]">
                                        <span class="text-sm text-slate-400">공개 답변 허용 (다른 사람들도 내 고민과 답변을 볼 수
                                            있습니다)</span>
                                    </label>
                                    <div class="password-group flex items-center gap-2">
                                        <span class="lock-icon text-slate-500">🔒</span>
                                        <input type="password" id="msgPassword"
                                            class="bg-white/5 border border-white/10 rounded-lg px-3 py-1 text-sm text-white outline-none focus:border-[var(--wiki-gold)] w-40"
                                            placeholder="비밀번호 (수정/삭제용)" maxlength="20">
                                    </div>
                                </div>

                                <button
                                    class="w-full py-4 bg-[var(--wiki-gold)] hover:bg-[#A88B52] text-[#0A0C10] font-bold rounded-lg transition-all"
                                    onclick="submitMessage()">우표 붙여 보내기 📮</button>
                            </div>
                        </section>

                        <!-- Tab Content: View -->
                        <section id="tab-view" class="tab-content">
                            <div id="publicMessageList" class="message-list space-y-4">
                                <!-- Loaded Dynamically -->
                                <div class="loading-state py-20 text-center">
                                    <div
                                        class="animate-spin rounded-full h-8 w-8 border-b-2 border-[var(--wiki-gold)] mx-auto mb-4">
                                    </div>
                                    <p class="text-slate-500 italic">우체통을 확인하고 있습니다...</p>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>

                <aside class="wiki-info-col" id="wikiInfoCol">
                    <div class="wiki-infobox animate-slide-up">
                        <div class="infobox-header">
                            <span class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Station
                                Info</span>
                            <h3 class="infobox-title mt-2">Terminal 77</h3>
                        </div>
                        <div class="infobox-data">
                            <div class="infobox-row">
                                <span class="infobox-label">Editor</span>
                                <span class="infobox-value">SMALLSM</span>
                            </div>
                            <div class="infobox-row">
                                <span class="infobox-label">Type</span>
                                <span class="infobox-value">위키형 아카라이브</span>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Detail Modal -->
                <div id="messageModal"
                    class="fixed inset-0 z-[10001] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                    <div
                        class="bg-[#0A1016] border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 md:p-8 animate-slide-up">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 id="modalNickname" class="text-xl font-bold text-white mb-1">익명</h3>
                                <span id="modalDate"
                                    class="text-xs font-mono text-slate-500 uppercase">2024.01.01</span>
                            </div>
                            <button
                                class="close-modal text-slate-400 hover:text-white transition-colors text-2xl">&times;</button>
                        </div>
                        <div class="space-y-6">
                            <div
                                class="p-6 bg-white/5 rounded-xl text-slate-300 italic border-l-4 border-[var(--wiki-gold)]">
                                <p id="modalQuestion"></p>
                            </div>
                            <div class="p-6 bg-[var(--wiki-gold-dim)] border border-[var(--wiki-border)] rounded-xl">
                                <div class="flex items-center gap-2 text-[var(--wiki-gold)] font-bold mb-4">
                                    <i data-lucide="mail" class="w-4 h-4"></i> 답장
                                </div>
                                <p id="modalAnswer" class="text-slate-200"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer py-4 mt-8 border-t border-slate-200 dark:border-slate-800">
            <p id="copyrightText" class="text-xs opacity-50 text-center">© 2026 - PRESENT SMALLSM. All Rights Reserved.
            </p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/api/config" async></script>
    <script src="js/pages/mailbox.js"></script>
    <script src="js/admin/admin-inline.js?v=20260226_6"></script>
</body>

</html>
