<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- SEO & Open Graph -->
    <title id="siteTitleTag">SMALLSM Archive</title>
    <meta name="description" id="siteDescTag" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta name="google-site-verification" content="">
    <meta name="naver-site-verification" content="">

    <meta property="og:type" content="website">
    <meta property="og:title" content="SMALLSM Archive">
    <meta property="og:description" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta property="og:image" content="/assets/og-image.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Toast UI Viewer -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.css" />
</head>

<body>
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
                귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container content-blur" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">
                    <a href="index.html" style="text-decoration: none; color: inherit;">SMALLSM</a>
                </h1>
                <p class="site-subtitle">CINEMATIC ARCHIVE</p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="검색어를 입력하세요...">
            </div>

            <!-- Categories -->
            <nav>
                <ul class="category-nav" id="categoryNav">
                    <li class="menu-header">메뉴</li>
                    <li><a href="#" id="menuHome" class="active">🏠 홈</a></li>
                    <li><a href="#" id="menuInclinations">💞 세부성향</a></li>

                    <li class="menu-header">카테고리</li>
                    <div id="categoryList">
                        <!-- Javascript will populate this -->
                    </div>
                </ul>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <button class="mode-toggle" id="modeToggle">
                    <span>🌙</span>
                    <span>Night Library</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Header -->
            <header class="mobile-header">
                <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
                <div class="site-title">SMALLSM Archive</div>
            </header>

            <!-- Home Section -->
            <div id="homeSection" class="content-section active">
                <div class="welcome-hero">
                    <h1 class="welcome-title" id="welcomeTitle">환영합니다</h1>
                    <p class="welcome-subtitle" id="welcomeSubtitle">SMALLSM Archive에 오신 것을 환영합니다</p>
                </div>

                <div class="home-content toastui-editor-contents" id="welcomeContent">
                    <!-- Content from DB -->
                </div>

                <!-- Recent Posts Section (Optional) -->
                <div id="recentPostsSection" class="recent-posts-section" style="display: none;">
                    <h2 class="section-heading">최신 게시물</h2>
                    <div id="recentPostsList" class="recent-posts-list">
                        <!-- Dynamically loaded -->
                    </div>
                </div>
            </div>

            <!-- Inclinations Section -->
            <div id="inclinationsSection" class="content-section" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">세부성향 가이드</h2>
                    <p class="section-subtitle">성향별 특징과 역할을 자세히 알아보세요</p>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">전체</button>
                    <button class="filter-tab" data-filter="top">Top</button>
                    <button class="filter-tab" data-filter="bottom">Bottom</button>
                    <button class="filter-tab" data-filter="switch">Switch</button>
                </div>

                <!-- Cards Grid -->
                <div class="inclinations-grid" id="inclinationsGrid">
                    <!-- Dynamically loaded from JS -->
                </div>
            </div>

            <!-- Posts List Section -->
            <div id="postsSection" class="content-section" style="display: none;">
                <div class="content-panel">
                    <h1 class="post-title" id="postTitle"></h1>
                    <div class="post-meta">
                        <span id="postDate"></span>
                        <span id="postCategory"></span>
                    </div>
                    <div class="post-content toastui-editor-contents" id="postContent">
                        <!-- Post content will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="site-footer">
                <p id="copyrightText">© 2026 - PRESENT SMALLSM. All Rights Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config" async></script>
    <script src="js/main.js"></script>
</body>

</html>
