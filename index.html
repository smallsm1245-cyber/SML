<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SMALLSM Archive - Cinematic Records</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <div class="app-container content-blur" id="appContainer">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">SMALLSM</h1>
                <p class="site-subtitle">CINEMATIC ARCHIVE</p>
            </div>
            <nav><ul class="category-nav" id="categoryNav"></ul></nav>
        </aside>
        <main class="main-content">
            <div class="content-panel">
                <h1 class="post-title" id="welcomeTitle">환영합니다</h1>
                <div id="mainContent"><p>카테고리를 선택하세요.</p></div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
