<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index, follow">

    <!-- SEO & Open Graph -->
    <title id="siteTitleTag">SMALLSM Archive</title>
    <meta name="description" id="siteDescTag" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta name="google-site-verification" content="xVJHjYPHdCzKLhx_IDT3alrN58XteWHPdw9lXFGbBjs">
    <meta name="naver-site-verification" content="633bae745b1423c137704275575fa8f7c4b5fa97">

    <meta property="og:type" content="website">
    <meta property="og:title" content="SMALLSM Archive">
    <meta property="og:description" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta property="og:image" content="/assets/og-image.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            900: '#1a1a1a',
                            950: '#121212',
                        },
                        brand: {
                            primary: '#B68D40',
                            accent: '#D4A574',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    borderRadius: {
                        'brand': '8px',
                    },
                    lineHeight: {
                        relaxed: '1.85',
                    }
                }
            }
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=20260226">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
            // Check age verification immediately to prevent flash
            (function () {
                const verified = localStorage.getItem('age_verified');
                if (verified) {
                    const timestamp = parseInt(verified);
                    const VERIFICATION_DURATION = 24 * 60 * 60 * 1000;
                    if (Date.now() - timestamp < VERIFICATION_DURATION) {
                        document.documentElement.classList.add('verified');
                        document.write('<style>#disclaimerOverlay { display: none !important; } .content-blur { filter: none !important; pointer-events: auto !important; }</style>');
                    }
                }
                // Check Dark Mode
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                } else {
                    document.documentElement.classList.remove('dark')
                }
            })();
    </script>
</head>

<body
    class="bg-[#F5F6F7] dark:bg-black text-[#373A3C] dark:text-slate-100 font-serif selection:bg-brand-primary/20 transition-colors duration-300">
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-md px-6">
        <div
            class="bg-white dark:bg-slate-900 p-8 rounded-lg max-w-sm w-full text-center shadow-2xl border border-slate-200 dark:border-slate-800">
            <h2 class="text-2xl font-bold mb-4 font-serif text-brand-primary">성인 인증</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
                귀하는 만 19세 이상이십니까?
            </p>
            <div class="flex flex-col gap-3">
                <button
                    class="w-full py-4 bg-brand-primary text-[#000] rounded-lg font-bold hover:bg-brand-primary/80 transition-colors"
                    id="btnYes">예 (19세 이상)</button>
                <button
                    class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-lg font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                    id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Global Menu Button -->
    <button id="menuToggleBtn" class="fixed top-3 left-3 z-[101] p-2 text-brand-primary hover:scale-110 transition-all"
        aria-label="Menu">
        <i data-lucide="menu" class="w-7 h-7" style="stroke-width: 2.5px;"></i>
    </button>

    <!-- Content Area -->
    <div id="appContainer"
        class="max-w-screen-md mx-auto pt-6 pb-12 px-3 md:px-4 min-h-screen transition-all duration-300">
        <!-- Main Dashboard -->
        <main class="space-y-4">
            <section id="welcomeSection" class="pt-0 pb-2 border-b border-slate-200 dark:border-slate-800">
                <h2 id="welcomeTitle" class="text-2xl font-bold font-serif mb-1 leading-tight text-brand-primary">
                    Archive</h2>
                <div class="post-meta text-slate-500 text-xs font-medium tracking-wide flex items-center gap-2">
                    <span id="welcomeSubtitle">Exploring the records of tendencies and practices</span>
                </div>
            </section>

            <!-- Dynamic Content -->
            <div id="mainContent"
                class="prose prose-slate dark:prose-invert max-w-none leading-relaxed font-serif text-lg">
                <!-- Loaded dynamically -->
                <div class="flex justify-center py-20">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-primary"></div>
                </div>
            </div>

            <!-- Settings View (Hidden) -->
            <div id="settingsView" class="hidden space-y-8 py-4">
                <h2 class="text-2xl font-bold font-serif mb-6">Settings</h2>
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-6 space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">비상탈출 (Quick Exit)
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm block mb-2 text-slate-500">위장 URL</label>
                                <input type="text" id="escapeUrlInput"
                                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-4 py-3 outline-none focus:border-brand-primary/50 transition-colors"
                                    placeholder="https://www.google.com">
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://www.google.com">Google</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://ko.wikipedia.org">Wikipedia</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://news.naver.com">News</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Sidebar / Drawer -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 z-[100] bg-white dark:bg-black border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 hidden">
        <div class="h-full flex flex-col p-6">
            <h1 class="text-2xl font-bold font-serif text-brand-primary mb-8">SMALLSM</h1>
            <div class="relative mb-8">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="searchInput"
                    class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg pl-10 pr-4 py-3 text-sm"
                    placeholder="Search archive...">
            </div>
            <nav class="flex-1 overflow-y-auto">
                <ul id="categoryNav" class="space-y-1 mb-8">
                    <!-- Loaded dynamically -->
                </ul>
                <div class="pt-6 border-t border-slate-200 dark:border-slate-800 space-y-2">
                    <button id="sidebarSettingsBtn"
                        class="w-full flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-lg transition-colors text-left">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span class="font-medium">설정 (Settings)</span>
                    </button>
                </div>
            </nav>
        </div>
    </aside>
    <!-- Scrim-like Overlay for Menu -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300">
    </div>


    <!-- Emergency Button (Panic) -->
    <button id="emergencyFab"
        class="fixed right-6 bottom-6 z-50 w-14 h-14 bg-brand-primary text-black rounded-full shadow-lg shadow-brand-primary/30 flex items-center justify-center hover:scale-110 active:scale-95 transition-all opacity-20 hover:opacity-100">
        <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
    </button>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config" async></script>
    <script src="js/main.js"></script>
    <script src="js/admin-inline.js"></script>

</body>

</html>
