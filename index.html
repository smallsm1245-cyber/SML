<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmallSM Dictionary</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS Framework (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#0f0f11', // Darker gray instead of total black for paper
                        'paper-dark': '#050505',
                        card: '#16161a',
                        ink: '#e2e8f0', // Slate gray for text
                        'ink-dim': '#94a3b8',
                        primary: '#a3e635', // Neon green/yellow for primary (highlighter vibe)
                        'primary-dim': '#65a30d',
                        gold: '#fbbf24', // Highlighter yellow
                        'gold-bright': '#fde047',
                        'accent-blue': '#38bdf8', // Highlighter neon blue
                        admin: '#38bdf8',
                    },
                    fontFamily: {
                        serif: ['"Nanum Myeongjo"', 'serif'],
                        sans: ['"Nanum Gothic"', 'sans-serif'],
                        inter: ['"Inter"', 'sans-serif'],
                        outfit: ['"Outfit"', 'sans-serif'],
                    },
                    backdropBlur: {
                        xs: '2px',
                    },
                }
            }
        }
    </script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fdfcf8">

    <!-- Styles -->
    <link rel="stylesheet" href="css/dictionary.css">
    <link rel="stylesheet" href="css/archive-layout.css">
</head>

<body class="bg-paper text-ink overflow-hidden font-serif">
    <!-- Emergency Exit -->
    <div id="emergencyExit"
        class="fixed top-4 left-4 z-50 cursor-pointer opacity-20 hover:opacity-100 transition-opacity">
        <i data-lucide="x-circle" class="w-6 h-6 text-ink"></i>
    </div>

    <!-- Main Wrapper (Notebook Style) -->
    <div
        class="flex flex-col h-[calc(100vh-2rem)] my-4 max-w-2xl mx-auto rounded-r-3xl rounded-l-md shadow-[20px_0_50px_rgba(0,0,0,0.8)] relative bg-paper overflow-hidden border border-white/5 border-l-black/80">
        
        <!-- Notebook Binding (Spring/Binder illusion) -->
        <div class="absolute left-0 top-0 bottom-0 w-8 bg-paper-dark border-r border-white/5 z-50 flex flex-col justify-evenly py-8 opacity-80 pointer-events-none">
            <!-- Binding holes -->
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
            <div class="w-3 h-3 rounded-full bg-black mx-auto shadow-inner ring-1 ring-white/10"></div>
        </div>

        <!-- Margin Line (Red vertical line common in notebooks) -->
        <div class="absolute left-16 top-0 bottom-0 w-px bg-red-900/40 z-0 pointer-events-none"></div>

        <!-- Premium Archive Header -->
        <header class="pl-24 pr-8 pt-12 pb-8 border-b border-white/10 bg-transparent relative overflow-hidden z-10">
            <!-- Decorative "Archive" marker -->
            <div id="editable-series"
                class="absolute top-4 right-6 text-[10px] font-black border border-gold/40 text-gold px-3 py-1 opacity-70 uppercase tracking-[0.2em] rounded-sm bg-gold/10 backdrop-blur-sm admin-editable"
                data-key="site_series">
                SERIES: MASTER'S NOTE
            </div>

            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-2 mb-2">
                    <div class="h-[1px] w-8 bg-gold/30"></div>
                    <h2 class="text-[11px] font-bold tracking-[0.2em] text-gold/80 uppercase">주인장의 요점 정리 노트
                    </h2>
                    <div class="h-[1px] w-8 bg-gold/30"></div>
                </div>
                <h1 class="text-3xl font-black text-ink py-4 tracking-tighter leading-none">
                    <span id="editable-title-main" class="text-gold admin-editable"
                        data-key="site_title_main">성향학</span>
                    <span id="editable-title-sub" class="admin-editable" data-key="site_title_sub">개론</span> <br />
                    <span id="editable-subtitle"
                        class="text-[10px] font-bold tracking-[0.1em] text-ink-dim opacity-50 uppercase admin-editable"
                        data-key="site_subtitle">Master's Summary Note</span>
                </h1>
            </div>

            <div class="grid grid-cols-2 gap-4 text-[10px] font-bold border-t border-white/5 pt-6">
                <div class="flex items-center gap-2 border-r border-white/5 pr-4 group">
                    <span
                        class="text-gold/40 uppercase tracking-widest group-hover:text-gold transition-colors">Code:</span>
                    <span id="editable-code" class="tracking-widest text-ink/80 admin-editable"
                        data-key="site_code">SML-A101</span>
                </div>
                <div class="flex items-center gap-2 pl-4 group">
                    <span
                        class="text-gold/40 uppercase tracking-widest group-hover:text-gold transition-colors">Ref:</span>
                    <span id="editable-ref" class="text-ink/80 admin-editable" data-key="site_ref">Antigravity</span>
                </div>
            </div>

            <div class="mt-8 relative group">
                <i data-lucide="search"
                    class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gold group-focus-within:text-gold-bright transition-colors"></i>
                <input type="text" id="searchInput"
                    class="w-full bg-card border border-white/5 rounded-2xl pl-12 pr-4 py-4 text-sm focus:border-gold/50 focus:ring-1 focus:ring-gold/20 outline-none transition-all placeholder:text-ink-dim/30 font-sans shadow-inner"
                    placeholder="주인장의 요점 정리를 검색하세요...">
            </div>
        </header>

        <!-- High-Density List Container -->
        <main class="flex-1 overflow-y-auto custom-scroll pb-24 bg-transparent z-10 pl-16" id="dictionaryList">
            <!-- Items injected by JS -->
            <div class="p-10 text-center text-ink-dim py-32 italic">
                <div class="animate-pulse">노트를 펼치는 중입니다...</div>
            </div>
        </main>

        <!-- Right Toolkit Bar (Styled as margin notes or index tags) -->
        <nav class="fixed right-2 top-1/2 -translate-y-1/2 flex flex-col gap-2 p-1 bg-paper border-2 border-ink/10 rounded-lg shadow-md z-40"
            id="toolkitBar">
            <!-- Category icons injected by JS -->
        </nav>

        <!-- Bottom Controls -->
        <footer
            class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-2xl p-6 bg-gradient-to-t from-paper to-transparent pointer-events-none">
            <div class="flex justify-center gap-8 pointer-events-auto">
                <button id="bookmarkToggle"
                    class="p-5 bg-card border border-white/10 rounded-full shadow-2xl hover:bg-paper-dark transition-all active:scale-90 group">
                    <i data-lucide="star" class="w-6 h-6 text-ink-dim group-hover:text-gold transition-colors"></i>
                </button>
                <button id="adminLoginBtn"
                    class="p-5 bg-card border border-white/10 rounded-full shadow-2xl hover:bg-paper-dark transition-all active:scale-90 group">
                    <i data-lucide="key" class="w-6 h-6 text-ink-dim group-hover:text-gold transition-colors"></i>
                </button>
                <button id="addNewBtn"
                    class="p-5 bg-gold text-paper-dark font-black rounded-full shadow-2xl hover:bg-gold-bright transition-all hidden active:scale-90">
                    <i data-lucide="edit" class="w-6 h-6"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Login Modal (Styled as Academic Integrity Pledge) -->
    <div id="loginModal"
        class="fixed inset-0 bg-paper/60 backdrop-blur-md z-[150] hidden items-center justify-center p-4">
        <div
            class="bg-card w-full max-w-sm border border-gold/30 p-10 shadow-[0_0_50px_rgba(212,175,55,0.15)] animate-fade-in rounded-3xl">
            <h2 class="text-2xl font-black text-ink mb-2 flex items-center gap-3 border-b border-white/5 pb-4">
                <i data-lucide="shield-check" class="text-gold"></i>
                관리자 인증
                <span class="text-[9px] font-bold text-ink-dim opacity-50 ml-auto uppercase tracking-widest">Auth
                    v2.0</span>
            </h2>
            <p class="text-[10px] text-gold/60 mt-2 mb-8 italic font-bold">ACCESS RESTRICTED: AUTHORIZED PERSONNEL ONLY
            </p>
            <div class="space-y-6 font-sans">
                <div class="relative group">
                    <label class="block text-[10px] font-black text-ink-dim uppercase tracking-widest mb-2 ml-1">Archive
                        ID (E-mail)</label>
                    <input type="email" id="loginEmail"
                        class="w-full bg-paper border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none transition-all placeholder:text-ink-dim/30 focus:border-gold/30 focus:ring-1 focus:ring-gold/20"
                        placeholder="admin@sm-archive.ac.kr">
                </div>
                <div class="relative group">
                    <label class="block text-[10px] font-black text-ink-dim uppercase tracking-widest mb-2 ml-1">Access
                        Token (Password)</label>
                    <input type="password" id="loginPassword"
                        class="w-full bg-paper border border-white/5 rounded-2xl px-5 py-4 text-sm outline-none transition-all placeholder:text-ink-dim/30 focus:border-gold/30 focus:ring-1 focus:ring-gold/20"
                        placeholder="••••••••">
                </div>
                <button id="submitLoginBtn"
                    class="w-full py-5 bg-gold text-paper font-black rounded-2xl mt-4 hover:bg-gold-bright transition-all shadow-xl active:scale-95 text-sm">
                    인증 코드 제출
                </button>
                <button onclick="closeLoginModal()"
                    class="w-full py-4 text-ink-dim text-[11px] font-bold hover:text-ink transition-colors uppercase tracking-widest">
                    취소 (Exit)
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet Overlay -->
    <div id="bottomSheetOverlay"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-300">
    </div>

    <!-- Bottom Sheet -->
    <div id="bottomSheet"
        class="fixed bottom-0 left-0 w-full max-h-[90vh] bg-dark-alt rounded-t-[2rem] border-t border-gray-800 z-[101] transform translate-y-full transition-transform duration-300 ease-out flex flex-col">
        <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto my-4 flex-shrink-0"></div>
        <div class="overflow-y-auto px-6 pb-12 flex-1 custom-scroll" id="sheetContent">
            <!-- Detailed content injected by JS -->
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui-renderer.js"></script>
    <script src="js/archive-renderer.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('🚀 Service Worker registered');
                }).catch(err => {
                    console.warn('❌ Service Worker failed:', err);
                });
            });
        }
    </script>
</body>

</html>
