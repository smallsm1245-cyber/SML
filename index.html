<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- SEO & Open Graph -->
    <title>SMALLSM Archive - Cinematic Records</title>
    <meta name="description" content="SMALLSM의 시네마틱 아카이브. 성향과 실천에 관한 깊이 있는 기록.">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="SMALLSM Archive">
    <meta property="og:description" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta property="og:image" content="/assets/og-image.jpg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
            귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container content-blur" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">SMALLSM</h1>
                <p class="site-subtitle">CINEMATIC ARCHIVE</p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" 
                       class="search-input" 
                       id="searchInput"
                       placeholder="검색어를 입력하세요...">
            </div>

            <!-- Categories -->
            <nav>
                <ul class="category-nav" id="categoryNav">
                    <!-- Dynamically loaded -->
                </ul>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <button class="mode-toggle" id="modeToggle">
                    <span>🌙</span>
                    <span>Night Library</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-panel">
                <h1 class="post-title" id="welcomeTitle">환영합니다</h1>
                <div class="post-meta">
                    <span>SMALLSM Archive에 오신 것을 환영합니다</span>
                </div>
                <div class="post-content" id="mainContent">
                    <p>좌측 사이드바에서 카테고리를 선택하여 기록을 탐색하세요.</p>
                    <p>이곳은 성향과 실천, 그리고 깊이 있는 사색이 담긴 공간입니다.</p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="site-footer">
                <p>© 2026 - PRESENT SMALLSM. All Rights Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        // 환경 변수 로드 후 메인 스크립트 실행
        (async function init() {
            console.log('🚀 초기화 시작...');
            
            // 1. 환경 변수 로드
            try {
                // Vercel 배포 환경
                const response = await fetch('/api/config');
                if (response.ok) {
                    const configScript = await response.text();
                    eval(configScript);
                    console.log('✅ Vercel 환경 변수 로드 완료');
                } else {
                    throw new Error('API 응답 실패');
                }
            } catch (e) {
                console.log('📦 로컬 환경 - 기본값 설정');
                // 로컬 개발 환경
                window.SUPABASE_CONFIG = { url: '', anonKey: '' };
                window.ADMIN_EMAIL = '';
                
                // config.local.js 시도
                await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = 'js/config.local.js';
                    script.onload = () => {
                        console.log('✅ config.local.js 로드 완료');
                        resolve();
                    };
                    script.onerror = () => {
                        console.warn('⚠️ config.local.js를 찾을 수 없습니다');
                        resolve();
                    };
                    document.head.appendChild(script);
                });
            }
            
            // 2. Supabase 라이브러리 로드 대기
            if (typeof window.supabase === 'undefined') {
                console.error('❌ Supabase 라이브러리가 로드되지 않았습니다');
                return;
            }
            
            // 3. main.js 로드
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'js/main.js';
                script.onload = () => {
                    console.log('✅ main.js 로드 완료');
                    resolve();
                };
                script.onerror = () => {
                    console.error('❌ main.js 로드 실패');
                    reject();
                };
                document.head.appendChild(script);
            });
            
            console.log('🎉 초기화 완료!');
        })();
    </script>
</body>
</html>
