<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- SEO & Open Graph -->
    <title id="siteTitleTag">SMALLSM Archive</title>
    <meta name="description" id="siteDescTag" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta name="google-site-verification" content="">
    <meta name="naver-site-verification" content="">

    <meta property="og:type" content="website">
    <meta property="og:title" content="SMALLSM Archive">
    <meta property="og:description" content="시네마틱 아카이브 - 성향과 실천의 기록">
    <meta property="og:image" content="/assets/og-image.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Manifest & PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B68D40">
    <link rel="apple-touch-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Toast UI Viewer -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.css" />
</head>

<body>
    <!-- Admin Utility Bar (Hidden by default) -->
    <div class="admin-utility-bar" id="adminUtilityBar">
        <button class="util-btn" onclick="toggleEditMode()">[편집]</button>
        <button class="util-btn" onclick="showHistory()">[역사]</button>
        <button class="util-btn" onclick="showDiscussion()">[토론]</button>
    </div>

    <!-- Reading Progress Bar -->
    <div id="scrollProgress" class="scroll-progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
                귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Mobile Header (Visible only on mobile) -->
    <header class="mobile-header">
        <button class="menu-toggle" id="menuToggleBtn">☰</button>
        <div class="mobile-logo">SMALLSM</div>
        <div style="width: 40px;"></div> <!-- Spacer for balance -->
    </header>

    <!-- Sidebar Overlay (Scrim) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main App Container -->
    <div class="app-container content-blur" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">
                    <a href="index.html" style="text-decoration: none; color: inherit;">SMALLSM</a>
                </h1>
                <p class="site-subtitle">CINEMATIC ARCHIVE</p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="검색어를 입력하세요...">
            </div>

            <!-- Categories -->
            <nav>
                <ul class="category-nav" id="categoryNav">
                    <!-- Dynamically loaded -->
                </ul>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <button class="mode-toggle" id="modeToggle">
                    <span>🌙</span>
                    <span>Night Library</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-panel">
                <h1 class="post-title" id="welcomeTitle">환영합니다</h1>
                <div class="post-meta">
                    <span>SMALLSM Archive에 오신 것을 환영합니다</span>
                </div>
                <div class="post-content" id="mainContent">
                    <p>좌측 사이드바에서 카테고리를 선택하여 기록을 탐색하세요.</p>
                    <p>이곳은 성향과 실천, 그리고 깊이 있는 사색이 담긴 공간입니다.</p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="site-footer">
                <p id="copyrightText">© 2026 - PRESENT SMALLSM. All Rights Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Bottom Navigation Bar (Mobile / Minimalist) -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="window.location.reload()">
            <span class="nav-label">[홈]</span>
        </button>
        <button class="nav-item" onclick="toggleMobileSidebar()">
            <span class="nav-label">[성격]</span>
        </button>
        <button class="nav-item" onclick="openDualComparison()">
            <span class="nav-label">[비교]</span>
        </button>
        <button class="nav-item exit-item" onclick="quickExit()">
            <span class="nav-label">[탈출]</span>
        </button>
    </nav>

    <!-- Floating Quick Menu (FAB Menu) -->
    <div class="fab-menu" id="fabMenu">
        <button class="fab-action" onclick="scrollToTop()">🔝 맨 위로</button>
        <button class="fab-action" onclick="openSelector('a')">📋 대상 A</button>
        <button class="fab-action" onclick="openSelector('b')">📋 대상 B</button>
        <button class="fab-action" onclick="toggleTOC()">📑 목차</button>
    </div>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config" async></script>
    <script src="js/main.js"></script>
</body>

</html>
