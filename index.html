    <!-- Fonts: Noto Serif KR & Playfair Display for 'Quiet Luxury' -->

        rel="stylesheet">

    <!-- Tailwind CSS (Quiet Luxury Design Tokens) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: {
                            night: '#050805', // Deep Obsidian Green
                            deep: '#0a0f0a',
                            mist: '#1a241a',
                        },
                        bamboo: {
                            gold: '#D4C9A8', // Muted Bone/Yellow
                            dim: '#8B836B',
                            light: '#F2ECD9',
                        },
                        leaf: {
                            DEFAULT: '#4A554A',
                            dim: '#2D352D',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        display: ['"Playfair Display"', 'serif'],
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    letterSpacing: {
                        widest: '0.25em',
                        luxury: '0.15em',
                    },
                    lineHeight: {
                        exhibition: '1.9',
                    },
                    animation: {
                        'mist-reveal': 'mistReveal 2s cubic-bezier(0.77, 0, 0.175, 1) forwards',
                        'vertical-slide': 'verticalSlide 1.5s ease-out forwards',
                        'sway-slow': 'sway 8s ease-in-out infinite',
                        'sway-slower': 'sway 12s ease-in-out infinite',
                    },
                    keyframes: {
                        mistReveal: {
                            '0%': { opacity: '0', filter: 'blur(20px)', transform: 'scale(1.05)' },
                            '100%': { opacity: '1', filter: 'blur(0)', transform: 'scale(1)' },
                        },
                        verticalSlide: {
                            '0%': { transform: 'scaleY(0)', transformOrigin: 'top' },
                            '100%': { transform: 'scaleY(1)', transformOrigin: 'top' },
                        },
                        sway: {
                            '0%, 100%': { transform: 'rotate(-1deg) translateX(0)' },
                            '50%': { transform: 'rotate(1.5deg) translateX(10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
            // Check age verification immediately to prevent flash
            (function () {
                const verified = localStorage.getItem('age_verified');
                if (verified) {
                    const timestamp = parseInt(verified);
                    const VERIFICATION_DURATION = 24 * 60 * 60 * 1000;
                    if (Date.now() - timestamp < VERIFICATION_DURATION) {
                        document.documentElement.classList.add('verified');
                        document.write('<style>#disclaimerOverlay { display: none !important; } .content-blur { filter: none !important; pointer-events: auto !important; }</style>');
                    }
                }
                // Check Dark Mode
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                } else {
                    document.documentElement.classList.remove('dark')
                }
            })();
    </script>
</head>

<body
    class="bg-[#020502] text-white/70 font-serif selection:bg-bamboo-gold/20 transition-colors duration-1000 overflow-x-hidden">
