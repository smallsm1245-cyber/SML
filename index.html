<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALLSM Archive</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <div class="app-container content-blur" id="appContainer">
        <aside class="sidebar">
            <h1 class="site-title">SMALLSM</h1>
            <nav><ul class="category-nav" id="categoryNav"></ul></nav>
        </aside>
        <main class="main-content">
            <div id="mainContent">카테고리를 선택해주세요.</div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
