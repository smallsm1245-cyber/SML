<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALLSM Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Courier+Prime&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area">
            <h1 class="logo-full">SMALLSM</h1>
            <span class="logo-short">SLM</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="기록 검색...">
        </div>
        <nav class="category-nav">
            <ul id="categoryList">
                <li class="loading">연결 중...</li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <button id="themeToggle"><span class="mode-icon">🌙</span></button>
        </div>
    </aside>

    <main class="main-panel">
        <article id="contentArea" class="glass-panel">
            <div class="content-header">
                <h2 id="postTitle">SMALLSM Archive</h2>
                <div id="postMeta" class="post-meta"></div>
            </div>
            <hr class="divider">
            <div id="postContent" class="post-body">
                왼쪽 메뉴에서 카테고리를 선택하여 기록을 열람하십시오.
            </div>
        </article>
        <footer class="main-footer">
            <p>© 2026 - PRESENT <span class="author">SMALLSM</span>. All Rights Reserved.</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
