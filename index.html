<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMALLSM Archive</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="blur-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:10000; display:flex; justify-content:center; align-items:center;">
        <div class="disclaimer-box" style="width:80%; border:1px solid #CEB180; padding:2rem; text-align:center; background:#0F0F0E;">
            <h2 style="font-family:Cinzel; color:#CEB180; margin-bottom:1.5rem;">ADULT ONLY</h2>
            <p style="color:#eee; margin-bottom:2rem; font-size:0.9rem;">본 기록소는 성인 전용입니다.<br>입장하시겠습니까?</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-brass" style="width:100%; padding:15px; background:transparent; border:1px solid #CEB180; color:#CEB180;" onclick="verifyAge(true)">YES (ENTER)</button>
                <button class="btn-brass" style="width:100%; padding:15px; color:#666; border:1px solid #333;" onclick="verifyAge(false)">NO (EXIT)</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside id="sidebar">
            <h1 style="font-family:Cinzel; color:#CEB180; font-size:1.5rem;" onclick="location.reload()">SLM</h1>
            <nav id="category-nav" style="margin-top:2rem;">
                </nav>
        </aside>

        <main id="main-panel" style="padding:20px;">
            <div id="content-area">
                <h2 style="font-family:Cinzel; border-bottom:1px solid #CEB180; padding-bottom:10px;">WELCOME</h2>
                <p style="margin-top:20px; opacity:0.6;">기록을 열람하려면 카테고리를 선택하세요.</p>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script>
        // 1. 성인 인증 (이 함수는 최상단에 배치)
        function verifyAge(isAdult) {
            if (isAdult) {
                localStorage.setItem('adult_verified', 'true');
                document.getElementById('blur-overlay').style.display = 'none';
                initArchive(); // 인증 성공 시 앱 시작
            } else {
                window.location.href = "https://www.google.com";
            }
        }

        // 2. 앱 초기화 (인증 후 또는 이미 인증된 경우 실행)
        let supabase;
        async function initArchive() {
            if (typeof CONFIG === 'undefined') return;
            
            // Supabase 초기화
            supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            
            // 카테고리 로드
            const { data, error } = await supabase.from('categories').select('*').eq('is_visible', true).order('display_order');
            if (data) {
                const nav = document.getElementById('category-nav');
                nav.innerHTML = '<p style="font-size:0.7rem; color:#CEB180; opacity:0.5; margin-bottom:1rem;">CATEGORIES</p>';
                data.forEach(cat => {
                    const div = document.createElement('div');
                    div.style = "padding:10px 0; border-bottom:1px solid rgba(206,177,128,0.1); font-size:0.9rem;";
                    div.innerHTML = `<span style="color:#CEB180">▶</span> ${cat.name}`;
                    div.onclick = () => loadPosts(cat.id, cat.name);
                    nav.appendChild(div);
                });
            }
        }

        // 포스트 목록 로드
        async function loadPosts(cid, cname) {
            const area = document.getElementById('content-area');
            const { data } = await supabase.from('archive_posts').select('id, title').eq('category_id', cid).eq('is_private', false);
            
            let html = `<h2 style="font-family:Cinzel; color:#CEB180; border-bottom:1px solid #CEB180; padding-bottom:10px;">${cname}</h2>`;
            if (data && data.length > 0) {
                data.forEach(p => {
                    html += `<div onclick="loadDetail('${p.id}')" style="padding:15px 0; border-bottom:1px solid #222;">${p.title}</div>`;
                });
            } else {
                html += `<p style="margin-top:20px;">보관된 기록이 없습니다.</p>`;
            }
            area.innerHTML = html;
        }

        // 포스트 상세 로드
        async function loadDetail(pid) {
            const { data } = await supabase.from('archive_posts').select('*').eq('id', pid).single();
            if (data) {
                document.getElementById('content-area').innerHTML = `
                    <h2 style="color:#CEB180;">${data.title}</h2>
                    <div style="margin-top:20px; line-height:1.8; font-size:1rem;">${data.content}</div>
                    <button class="btn-brass" onclick="location.reload()" style="margin-top:30px; width:100%;">LIST</button>
                `;
            }
        }

        // 실행
        window.onload = () => {
            if (localStorage.getItem('adult_verified') === 'true') {
                document.getElementById('blur-overlay').style.display = 'none';
                initArchive();
            }
        };
    </script>
</body>
</html>
