<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALLSM Archive</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 class="cinzel">ADULT ONLY</h2>
            <p style="font-size:0.8rem; opacity:0.7;">성인 인증 후 입장 가능합니다.</p>
            <button class="btn-brass" onclick="grantAccess()">YES (ENTER)</button>
        </div>
    </div>

    <div class="container">
        <aside id="sidebar">
            <h1 class="cinzel" style="font-size:1.5rem;">SLM</h1>
            <nav id="category-nav" style="margin-top:40px;"></nav>
        </aside>
        <main id="main-panel">
            <div id="content-area">기록을 불러오는 중...</div>
        </main>
    </div>

    <script src="config.js"></script>
    <script>
        function grantAccess() {
            localStorage.setItem('slm_auth', 'true');
            document.getElementById('auth-overlay').style.display = 'none';
            initApp();
        }

        let supabase;
        async function initApp() {
            if (typeof CONFIG === 'undefined') return;
            supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            const { data } = await supabase.from('categories').select('*').eq('is_visible', true).order('display_order');
            const nav = document.getElementById('category-nav');
            nav.innerHTML = '';
            data?.forEach(c => {
                const div = document.createElement('div');
                div.style = "margin-bottom:15px; cursor:pointer; font-size:0.9rem;";
                div.innerHTML = `<span style="color:#CEB180">#</span> ${c.name}`;
                div.onclick = () => loadPosts(c.id);
                nav.appendChild(div);
            });
            document.getElementById('content-area').innerHTML = "카테고리를 선택하세요.";
        }

        window.onload = () => {
            if (localStorage.getItem('slm_auth') === 'true') {
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            }
        };
    </script>
</body>
</html>
