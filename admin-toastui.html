<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Admin Panel - SMALLSM Archive</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-toastui.css">
    <link rel="stylesheet" href="css/admin-toastui-hierarchy.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-body">
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-panel">
            <h2 class="login-title">🎬 관리자 로그인</h2>
            <div class="form-group">
                <label>이메일</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button id="loginBtn" class="btn-primary">로그인</button>
            <p id="loginError" class="error-message"></p>
            <p class="back-link"><a href="index.html">← 메인으로 돌아가기</a></p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-dashboard" style="display: none;">
        <!-- Top Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="dashboard-title">📚 SMALLSM Archive</h1>
                <span class="admin-badge">관리자 모드</span>
            </div>
            <div class="header-right">
                <button class="btn-secondary" onclick="window.open('index.html', '_blank')">🔗 사이트 보기</button>
                <button class="btn-secondary" id="logoutBtn">로그아웃</button>
            </div>
        </header>

        <div class="dashboard-container">
            <!-- Left Sidebar Menu -->
            <aside class="dashboard-sidebar">
                <nav class="sidebar-nav">
                    <button class="nav-item active" data-section="posts">
                        <span class="icon">📝</span>
                        <span class="text">게시글 관리</span>
                        <span class="badge" id="postCount">0</span>
                    </button>
                    <button class="nav-item" data-section="home">
                        <span class="icon">🏠</span>
                        <span class="text">홈 화면 관리</span>
                    </button>
                    <button class="nav-item" data-section="categories">
                        <span class="icon">📂</span>
                        <span class="text">카테고리</span>
                    </button>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="dashboard-main">
                <!-- Posts Management Section -->
                <section id="section-posts" class="content-section active">
                    <div class="section-header">
                        <h2 class="section-title">📝 게시글 관리</h2>
                        <button class="btn-primary" id="newPostBtn">✍️ 새 글 작성</button>
                    </div>

                    <!-- Post List View -->
                    <div id="postListView">
                        <!-- Search and Filter -->
                        <div class="card">
                            <div class="toolbar">
                                <input type="text" id="postSearch" class="search-input" placeholder="🔍 제목으로 검색...">
                                <select id="postFilterCategory" class="filter-select">
                                    <option value="">모든 카테고리</option>
                                </select>
                                <select id="postFilterStatus" class="filter-select">
                                    <option value="">모든 상태</option>
                                    <option value="public">공개</option>
                                    <option value="private">비공개</option>
                                </select>
                            </div>
                        </div>

                        <!-- Posts List -->
                        <div id="postsList" class="posts-list">
                            <div class="loading">게시물을 불러오는 중...</div>
                        </div>
                    </div>

                    <!-- Post Editor View (Hidden by default) -->
                    <div id="postEditorView" style="display: none;">
                        <div class="card">
                            <div class="editor-header">
                                <button class="btn-secondary" id="backToListBtn">← 목록으로</button>
                                <h3 id="editorTitle">새 글 작성</h3>
                            </div>

                            <!-- Post Meta -->
                            <div class="form-group">
                                <label for="postTitle">제목</label>
                                <input type="text" id="postTitle" class="form-input" placeholder="게시물 제목을 입력하세요">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="postCategory">카테고리</label>
                                    <select id="postCategory" class="form-select">
                                        <option value="">카테고리 선택</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="isPrivate">
                                        <span>비밀글로 설정</span>
                                    </label>
                                </div>

                                <div class="form-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="originFree">
                                        <span>복사 출처 비활성화</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Toast UI Editor -->
                            <div class="form-group">
                                <label>본문</label>
                                <div id="editor"></div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="action-buttons">
                                <button class="btn-secondary" id="saveDraftBtn">💾 임시 저장</button>
                                <button class="btn-primary" id="publishPostBtn">🚀 발행하기</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Home Screen Management Section -->
                <section id="section-home" class="content-section">
                    <h2 class="section-title">🏠 홈 화면 관리</h2>

                    <div class="split-layout">
                        <!-- Editor -->
                        <div class="editor-panel">
                            <div class="card">
                                <div class="form-group">
                                    <label>메인 제목</label>
                                    <input type="text" id="homeTitle" class="form-input" placeholder="환영합니다">
                                </div>

                                <div class="form-group">
                                    <label>부제목</label>
                                    <input type="text" id="homeSubtitle" class="form-input"
                                        placeholder="SMALLSM Archive에 오신 것을 환영합니다">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">메인 콘텐츠 (소개글)</label>
                                    <div id="homeEditor"></div>
                                </div>

                                <div class="form-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="showRecentPosts">
                                        <span>최신 게시물 표시</span>
                                    </label>
                                </div>

                                <div class="form-group" id="recentPostsCountGroup" style="display: none;">
                                    <label>표시할 게시물 개수</label>
                                    <input type="number" id="recentPostsCount" class="form-input" value="3" min="1"
                                        max="10">
                                </div>

                                <button class="btn-primary" id="saveHomeBtn">💾 저장하기</button>
                            </div>
                        </div>

                        <!-- Live Preview -->
                        <div class="preview-panel">
                            <div class="preview-header">
                                <span class="preview-title">실시간 미리보기</span>
                            </div>
                            <div class="preview-content" id="homePreview">
                                <h1 id="previewTitle">환영합니다</h1>
                                <p class="preview-subtitle" id="previewSubtitle">SMALLSM Archive에 오신 것을 환영합니다</p>
                                <div class="preview-body" id="previewContent">
                                    <p>좌측 사이드바에서 카테고리를 선택하여 기록을 탐색하세요.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Categories Management Section -->
                <section id="section-categories" class="content-section">
                    <h2 class="section-title">📂 카테고리 관리</h2>

                    <!-- Add Category -->
                    <div class="card">
                        <h3 class="card-title">➕ 새 카테고리 추가</h3>
                        <div class="add-category-form">
                            <select id="newCategoryParent" class="form-select" style="flex: 0 0 200px;">
                                <option value="">📁 대분류로 추가</option>
                            </select>
                            <input type="text" id="newCategoryName" class="form-input"
                                placeholder="카테고리 이름 (예: BDSM이란?)">
                            <button class="btn-primary" id="addCategoryBtn">추가하기</button>
                        </div>
                        <p style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--admin-text-dim);">
                            💡 대분류는 그룹 역할만 하며 글을 작성할 수 없습니다. 글 작성은 소분류에서만 가능합니다.
                        </p>
                    </div>

                    <!-- Categories List -->
                    <div id="categoriesList" class="categories-list">
                        <!-- Dynamically loaded -->
                    </div>

                    <div style="margin-top: 1.5rem; text-align: center;">
                        <button class="btn-primary" id="saveCategoriesBtn">💾 카테고리 순서 및 이름 저장</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="/api/config"></script>
    <script src="js/admin-toastui.js"></script>
</body>

</html>
