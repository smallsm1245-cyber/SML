<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Check</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .box {
            background: #222;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: #c00;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config"></script>
</head>

<body>
    <div class="box">
        <h2>환경 변수 연결 테스트</h2>
        <p id="status">연결 확인 중...</p>
        <div id="env-info" style="margin: 1rem 0; color: #aaa; font-size: 0.9rem;"></div>
        <button onclick="window.location.reload()">새로고침</button>
        <a href="/admin/index.html?force=true" style="color: #c00; margin-top: 1rem; display: block;">관리자 페이지로 이동</a>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const envInfoEl = document.getElementById('env-info');

        try {
            if (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url) {
                statusEl.innerHTML = "✅ 설정(Config) 로드 성공!";
                statusEl.style.color = "#0f0";
                envInfoEl.innerText = "Supabase URL: " + window.SUPABASE_CONFIG.url.substring(0, 15) + "...";
            } else {
                statusEl.innerHTML = "❌ 설정 로드 실패 (환경 변수 없음)";
                statusEl.style.color = "#f00";
                envInfoEl.innerText = "window.SUPABASE_CONFIG가 정의되지 않았습니다.";
            }
        } catch (e) {
            statusEl.innerText = "❌ 에러 발생: " + e.message;
        }
    </script>
</body>

</html>
