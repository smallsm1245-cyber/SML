<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Web Builder - SMALLSM Archive</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css?v=3">
    <link rel="stylesheet" href="/admin/css/admin-dashboard.css?v=3">
    <link rel="stylesheet" href="/admin/css/builder.css?v=1">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="builder-body">
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-panel">
            <h2 class="login-title">🛠️ 빌더 로그인</h2>
            <form id="loginForm" onsubmit="event.preventDefault(); window.handleBuilderLogin();">
                <div class="form-group">
                    <label for="loginEmail">이메일</label>
                    <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" id="loginBtn" class="btn-primary">로그인</button>
            </form>
            <p id="loginError" class="error-message"></p>
            <p class="back-link"><a href="/admin.html">← 어드민 대시보드로</a></p>
        </div>
    </div>

    <!-- Builder Interface -->
    <div id="builderInterface" class="builder-interface" style="display: none;">
        <!-- Top Toolbar -->
        <header class="builder-header">
            <div class="header-left">
                <button class="icon-btn" onclick="window.location.href='/admin.html'" title="어드민으로 돌아가기"><i
                        data-lucide="arrow-left"></i></button>
                <h1 class="builder-title">Web Builder</h1>
            </div>
            <div class="header-center">
                <button class="icon-btn active" title="Desktop"><i data-lucide="monitor"></i></button>
                <button class="icon-btn" title="Tablet"><i data-lucide="tablet"></i></button>
                <button class="icon-btn" title="Mobile"><i data-lucide="smartphone"></i></button>
            </div>
            <div class="header-right">
                <button class="btn-secondary" id="previewBtn"><i data-lucide="eye"></i> 미리보기</button>
                <button class="btn-primary" id="saveBtn"><i data-lucide="save"></i> 저장</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="builder-workspace">
            <!-- Left Panel: Components -->
            <aside class="panel left-panel">
                <div class="panel-header">
                    <h3>컴포넌트</h3>
                </div>
                <div class="panel-content">
                    <div class="component-list">
                        <div class="component-item" draggable="true" data-type="box">
                            <i data-lucide="square"></i> <span>박스 (Box)</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="text">
                            <i data-lucide="type"></i> <span>텍스트 (Text)</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="button">
                            <i data-lucide="mouse-pointer-click"></i> <span>버튼 (Button)</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="image">
                            <i data-lucide="image"></i> <span>이미지 (Image)</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center Panel: Canvas -->
            <section class="canvas-container" id="canvasContainer">
                <div class="canvas-wrapper">
                    <!-- The actual editing area -->
                    <div id="builderCanvas" class="builder-canvas">
                        <!-- Elements will be dropped here -->
                    </div>
                </div>
            </section>

            <!-- Right Panel: Properties -->
            <aside class="panel right-panel">
                <div class="panel-header">
                    <h3>속성 (Properties)</h3>
                </div>
                <div class="panel-content" id="propertyInspector">
                    <div class="empty-state">
                        <i data-lucide="mouse-pointer-2"></i>
                        <p>요소를 선택하여 속성을 편집하세요</p>
                    </div>
                    <div id="inspectorContent" style="display: none;">
                        <!-- Properties UI -->
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/api/config"></script>
    <script src="/admin/js/builder.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
