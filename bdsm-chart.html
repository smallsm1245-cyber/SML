    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=20260226">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />
    <style>
        /* 궁합별 색상 테마 - 대비 강화 버전 */
        .cell-optimal {
            background-color: #634a35;
            color: #ffffff;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px #b68d6a;
        }

        .cell-good {
            background-color: #433429;
            color: #e5e7eb;
            font-weight: 500;
        }

        .cell-fine {
            background-color: #2d2621;
            color: #9ca3af;
        }

        .cell-bad {
            background-color: #201b18;
            color: #6b7280;
        }

        .cell-worst {
            background-color: #110e0d;
            color: #374151;
        }

        .comp-table {
            border-collapse: separate;
            border-spacing: 2px;
            width: 100%;
            min-width: 800px;
            /* 가로 스크롤 확보 */
        }

        .comp-table th,
        .comp-table td {
            text-align: center;
            vertical-align: middle;
            padding: 16px 4px;
            /* 높이 약간 높임, 너비 줄임 */
            font-size: 0.85rem;
            border-radius: 3px;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
            word-break: keep-all;
            line-height: 1.2;
        }

        /* ------------------------------------- */
        /* Sticky Column 기능 추가 */
        /* ------------------------------------- */

        .comp-table th:first-child,
        .comp-table .row-header {
            position: sticky;
            left: 0;
            z-index: 5;
            width: auto;
            min-width: 85px;
        }

        .comp-table th:first-child {
            z-index: 6;
            /* 헤더의 첫 번째 셀은 교차점이므로 더 높게 */
        }

        /* 헤더 스타일 */
        .comp-table th {
            background-color: #261e19;
            color: #b68d6a;
            font-weight: 500;
            border-bottom: 2px solid #3b2f26;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .comp-table .row-header {
            background-color: #261e19;
            color: #9ca3af;
            font-weight: 500;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* 모바일 폰트 크기 최적화 */
        @media (max-width: 640px) {

            .comp-table th,
            .comp-table td {
                font-size: 0.75rem;
                /* 글자 크기 축소 */
                padding: 12px 4px;
            }
        }

        /* 편집 모드 효과 */
        .edit-mode td:not(.row-header):hover {
            cursor: pointer;
            filter: brightness(1.3);
            box-shadow: 0 0 8px rgba(182, 141, 106, 0.4);
            z-index: 10;
        }

        /* 스크롤바 커스텀 */
        .custom-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #1a1614;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #4a3728;
            border-radius: 10px;
        }
    </style>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Core Logic (Supabase, Age Gate, Dark Mode) -->
    <script src="js/core.js"></script>
</head>

<body class="bg-[#F5F6F7] dark:bg-black text-[#373A3C] dark:text-slate-100 font-serif transition-colors duration-300">
