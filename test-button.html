<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼 테스트</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-container {
            text-align: center;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .btn-yes {
            background: #4CAF50;
            color: white;
        }
        .btn-no {
            background: #f44336;
            color: white;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>성인 인증</h2>
        <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
        귀하는 만 19세 이상이십니까?</p>
        
        <button class="btn-yes" id="btnYes">예 (19세 이상)</button>
        <button class="btn-no" id="btnNo">아니요</button>
        
        <div id="result"></div>
    </div>

    <script>
        console.log('스크립트 시작');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM 로드됨');
            
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const result = document.getElementById('result');
            
            console.log('btnYes:', btnYes);
            console.log('btnNo:', btnNo);
            
            if (btnYes) {
                btnYes.addEventListener('click', () => {
                    console.log('예 버튼 클릭됨!');
                    result.textContent = '✅ 예 버튼이 정상 작동합니다!';
                    result.style.color = '#4CAF50';
                });
                console.log('예 버튼 이벤트 리스너 등록 완료');
            }
            
            if (btnNo) {
                btnNo.addEventListener('click', () => {
                    console.log('아니오 버튼 클릭됨!');
                    result.textContent = '❌ 아니오 버튼이 정상 작동합니다!';
                    result.style.color = '#f44336';
                });
                console.log('아니오 버튼 이벤트 리스너 등록 완료');
            }
        });
    </script>
</body>
</html>
