sonar.projectKey=smallsm1245-cyber_SML
sonar.organization=smallsm1245-cyber

# === 분석 대상 소스 설정 ===
sonar.sources=js,css,index.html,post.html,admin.html,mailbox.html

# === 제외 파일 (백업, 히스토리, 마이그레이션 등) ===
sonar.exclusions=\
  js_main_history.js,\
  js_main_original_utf8.js,\
  migrate_tendencies.js,\
  fix_project.js,\
  convert-korean-font.js,\
  fix-pdf-font.js,\
  debug.html,\
  **/*.sql,\
  **/*.ps1,\
  js/config.local.js,\
  js/config.local.example.js,\
  js/config.example.js

# === 복사(중복) 감지 제외 ===
sonar.cpd.exclusions=\
  js_main_history.js,\
  js_main_original_utf8.js,\
  migrate_tendencies.js,\
  fix_project.js

# === 커버리지 없는 환경 대응 ===
sonar.coverage.exclusions=**/*

# === 인코딩 ===
sonar.sourceEncoding=UTF-8

# === 언어 지정 ===
sonar.javascript.file.suffixes=.js
