name: Deploy to GitHub Pages

# 1. 언제 실행할지 결정 (main 브랜치에 코드가 올라올 때)
on:
  push:
    branches: [ main ]

# 2. GitHub 서버에 권한 부여 (아까 사진에서 설정한 내용과 연동됨)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 3. 중요: GitHub Secrets를 읽어서 실시간으로 config.js 생성
      - name: Create config.js
        run: |
          echo "const CONFIG = {
            SUPABASE_URL: '${{ secrets.SUPABASE_URL }}',
            SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}',
            ADMIN_EMAIL: '${{ secrets.ADMIN_EMAIL }}'
          };" > config.js

      # 4. 결과물을 gh-pages 브랜치에 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

