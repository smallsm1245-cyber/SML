<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Admin Panel - SMALLSM Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="loginScreen" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-deep);">
        <div style="background: var(--bg-panel); padding: 3rem; border-radius: 8px; border: 1px solid var(--glass-border); max-width: 400px; width: 90%;">
            <h2 style="color: var(--primary-brass); margin-bottom: 2rem; text-align: center;">관리자 로그인</h2>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">이메일</label>
                <input type="email" id="loginEmail" placeholder="smallsml@naver.com" 
                       style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 4px; color: var(--text-primary); font-size: 1rem;">
            </div>
            <div style="margin-bottom: 2rem;">
                <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem;">비밀번호</label>
                <input type="password" id="loginPassword" placeholder="비밀번호" 
                       style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 4px; color: var(--text-primary); font-size: 1rem;">
            </div>
            <button id="loginBtn" 
                    style="width: 100%; padding: 1rem; background: var(--primary-brass); color: var(--bg-deep); border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                로그인
            </button>
            <p id="loginError" style="color: #ff6b6b; margin-top: 1rem; text-align: center; display: none;"></p>
            <p style="color: var(--text-secondary); margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                <a href="index.html" style="color: var(--primary-brass); text-decoration: none;">← 메인으로 돌아가기</a>
            </p>
        </div>
    </div>

    <div class="admin-container" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <div>
                <h1 class="admin-title">관리자 패널</h1>
                <p class="site-subtitle">SMALLSM Archive Administration</p>
            </div>
            <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </header>

        <section class="editor-container">
            <h2 class="form-label">새 게시물 작성</h2>
            
            <div class="form-group">
                <label class="form-label" for="postTitle">제목</label>
                <input type="text" 
                       id="postTitle" 
                       class="form-input" 
                       placeholder="게시물 제목을 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label" for="postCategory">카테고리</label>
                <select id="postCategory" class="form-select">
                    <option value="">카테고리 선택</option>
                    </select>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="isPrivate" class="form-checkbox">
                    <label for="isPrivate">비밀글로 설정</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="originFree" class="form-checkbox">
                    <label for="originFree">복사 시 출처 표기 비활성화</label>
                </div>
            </div>

            <div class="editor-toolbar">
                <button class="editor-btn" onclick="formatText('bold')"><strong>B</strong></button>
                <button class="editor-btn" onclick="formatText('italic')"><em>I</em></button>
                <button class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                </div>

            <div class="split-editor">
                <div class="editor-pane">
                    <label class="form-label">편집</label>
                    <textarea id="contentEditor" 
                              class="editor-input" 
                              placeholder="내용을 입력하세요..."></textarea>
                </div>
                <div class="editor-pane">
                    <label class="form-label">미리보기</label>
                    <div id="contentPreview" class="preview-pane post-content">
                        <p style="color: var(--text-secondary);">미리보기 영역</p>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-save" id="savePostBtn">게시물 저장</button>
            </div>
        </section>

        <section class="editor-container">
            <h2 class="form-label">카테고리 관리</h2>
            
            <div id="categoryList">
                </div>
        </section>
    </div>

    <script src="/api/config"></script>
    <script src="js/admin-new.js"></script>
</body>
</html>
