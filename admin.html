<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML 관리자 모드 - 통합본</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-item:hover { background-color: #f1f5f9; color: #2563eb; }
        .active-menu { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <i data-lucide="layout-dashboard"></i> SML Admin
            </h1>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="admin.html" class="sidebar-item active-menu flex items-center gap-3 p-3 rounded-lg transition-all">
                <i data-lucide="home"></i> <span>대시보드</span>
            </a>
            <a href="#" class="sidebar-item flex items-center gap-3 p-3 rounded-lg text-slate-600 transition-all">
                <i data-lucide="file-text"></i> <span>게시글 관리</span>
            </a>
            <a href="/" class="sidebar-item flex items-center gap-3 p-3 rounded-lg text-slate-600 transition-all">
                <i data-lucide="external-link"></i> <span>사이트 바로가기</span>
            </a>
        </nav>
        <div class="p-4 border-t border-slate-200">
            <button onclick="logout()" class="flex items-center gap-3 w-full p-3 text-red-500 hover:bg-red-50 rounded-lg transition-all">
                <i data-lucide="log-out"></i> <span>로그아웃</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 class="text-lg font-semibold text-slate-800">관리 시스템</h2>
            <div class="flex items-center gap-4">
                <span id="admin-name" class="text-sm text-slate-500">관리자님 환영합니다</span>
            </div>
        </header>

        <div class="p-8 space-y-8">
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 mb-1">총 게시글</p>
                        <h3 class="text-3xl font-bold" id="total-count">0</h3>
                    </div>
                    <div class="p-4 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="files"></i></div>
                </div>
                </section>

            <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-lg text-slate-800">게시글 목록</h3>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-all flex items-center gap-2" onclick="location.href='post.html'">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> 새 글 작성
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-slate-600 border-b">ID</th>
                                <th class="p-4 text-sm font-semibold text-slate-600 border-b">제목</th>
                                <th class="p-4 text-sm font-semibold text-slate-600 border-b">작성일</th>
                                <th class="p-4 text-sm font-semibold text-slate-600 border-b text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="posts-list">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 기존에 사용하시던 API 호출 및 렌더링 로직 통합
        async function loadAdminData() {
            try {
                const response = await fetch('/api/posts'); // 기존 API 경로
                const posts = await response.json();
                
                const listBody = document.getElementById('posts-list');
                const totalCountEl = document.getElementById('total-count');
                
                listBody.innerHTML = '';
                totalCountEl.innerText = posts.length;

                posts.forEach(post => {
                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-sm text-slate-500 border-b">${post.id || post._id}</td>
                            <td class="p-4 text-sm font-medium text-slate-800 border-b">${post.title}</td>
                            <td class="p-4 text-sm text-slate-500 border-b">${new Date(post.createdAt).toLocaleDateString()}</td>
                            <td class="p-4 border-b text-center">
                                <button onclick="editPost('${post.id || post._id}')" class="text-blue-600 hover:text-blue-800 font-medium mr-3 text-sm">수정</button>
                                <button onclick="deletePost('${post.id || post._id}')" class="text-red-500 hover:text-red-700 font-medium text-sm">삭제</button>
                            </td>
                        </tr>
                    `;
                    listBody.insertAdjacentHTML('beforeend', row);
                });
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert("게시글을 불러오는 중 오류가 발생했습니다.");
            }
        }

        // 기존 삭제 기능 유지
        async function deletePost(id) {
            if (!confirm("정말로 이 게시글을 삭제하시겠습니까?")) return;
            
            try {
                const response = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("삭제되었습니다.");
                    loadAdminData(); // 목록 새로고침
                }
            } catch (error) {
                alert("삭제 실패");
            }
        }

        // 수정 페이지 이동
        function editPost(id) {
            location.href = `post.html?id=${id}`;
        }

        function logout() {
            // 기존 로그아웃 로직 (예: 세션 삭제 등)
            location.href = '/';
        }

        // 초기 실행
        window.onload = loadAdminData;
    </script>
</body>
</html>
