<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Admin Panel - SMALLSM Archive</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Admin Container -->
    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div>
                <h1 class="admin-title">관리자 패널</h1>
                <p class="site-subtitle">SMALLSM Archive Administration</p>
            </div>
            <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </header>

        <!-- Editor Section -->
        <section class="editor-container">
            <h2 class="form-label">새 게시물 작성</h2>
            
            <!-- Post Info -->
            <div class="form-group">
                <label class="form-label" for="postTitle">제목</label>
                <input type="text" 
                       id="postTitle" 
                       class="form-input" 
                       placeholder="게시물 제목을 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label" for="postCategory">카테고리</label>
                <select id="postCategory" class="form-select">
                    <option value="">카테고리 선택</option>
                    <!-- Dynamically loaded -->
                </select>
            </div>

            <!-- Privacy & Copy Protection -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="isPrivate" class="form-checkbox">
                    <label for="isPrivate">비밀글로 설정</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="originFree" class="form-checkbox">
                    <label for="originFree">복사 시 출처 표기 비활성화</label>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="editor-toolbar">
                <button class="editor-btn" onclick="formatText('bold')"><strong>B</strong></button>
                <button class="editor-btn" onclick="formatText('italic')"><em>I</em></button>
                <button class="editor-btn" onclick="formatText('underline')"><u>U</u></button>
                <button class="editor-btn" onclick="insertLink()">🔗 링크</button>
            </div>

            <!-- Split Editor -->
            <div class="split-editor">
                <div class="editor-pane">
                    <label class="form-label">편집</label>
                    <textarea id="contentEditor" 
                              class="editor-input" 
                              placeholder="내용을 입력하세요..."></textarea>
                </div>
                <div class="editor-pane">
                    <label class="form-label">미리보기</label>
                    <div id="contentPreview" class="preview-pane post-content">
                        <p style="color: var(--text-secondary);">미리보기 영역</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-save" id="savePostBtn">게시물 저장</button>
            </div>
        </section>

        <!-- Category Management -->
        <section class="editor-container">
            <h2 class="form-label">카테고리 관리</h2>
            
            <div id="categoryList">
                <!-- Dynamically loaded -->
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>

    <script>
        // Toolbar Functions
        function formatText(command) {
            document.execCommand(command, false, null);
            updatePreview();
        }

        function insertLink() {
            const url = prompt('링크 URL을 입력하세요:');
            if (url) {
                document.execCommand('createLink', false, url);
                updatePreview();
            }
        }

        // Real-time Preview
        const editor = document.getElementById('contentEditor');
        const preview = document.getElementById('contentPreview');

        editor.addEventListener('input', updatePreview);

        function updatePreview() {
            preview.innerHTML = editor.value
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/_(.*?)_/g, '<u>$1</u>')
                .replace(/\n/g, '<br>');
        }

        // Auto-save to localStorage
        let autoSaveTimer;
        editor.addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                localStorage.setItem('draft_content', editor.value);
                localStorage.setItem('draft_title', document.getElementById('postTitle').value);
            }, 1000);
        });

        // Restore draft on load
        window.addEventListener('load', () => {
            const savedContent = localStorage.getItem('draft_content');
            const savedTitle = localStorage.getItem('draft_title');
            
            if (savedContent) {
                if (confirm('저장된 임시 글이 있습니다. 불러오시겠습니까?')) {
                    editor.value = savedContent;
                    document.getElementById('postTitle').value = savedTitle || '';
                    updatePreview();
                }
            }
        });
    </script>
</body>
</html>
