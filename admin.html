<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SLM Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="max-width:800px; margin: 3rem auto; padding: 0 2rem;">
        <h2 class="cinzel" style="margin-bottom:2rem;">ADMINISTRATION</h2>
        <input type="text" id="post-title" placeholder="문서 제목을 입력하십시오">
        <select id="category-select"></select>
        <textarea id="post-content" style="height:400px;" placeholder="본문 기록 (HTML 지원)"></textarea>
        <button class="btn-brass" onclick="saveArchive()">기록 보관소에 저장</button>
    </div>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
