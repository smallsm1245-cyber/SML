<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALLSM Archive</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 class="cinzel">ADULT ONLY</h2>
            <p style="opacity:0.6; font-size:0.8rem; margin-bottom:2rem;">접속을 위해 성인 인증이 필요합니다.</p>
            <button class="btn-brass" onclick="grantAccess()">YES (ENTER)</button>
        </div>
    </div>

    <div class="container">
        <aside id="sidebar">
            <h1 class="cinzel" style="cursor:pointer;" onclick="location.reload()">SLM</h1>
            <nav id="category-nav" style="margin-top:3rem;"></nav>
            <footer style="margin-top:auto; font-size:0.6rem; opacity:0.3; font-family:'Courier Prime';">
                © 2026 SMALLSM.
            </footer>
        </aside>
        <main id="main-panel">
            <div id="content-area">기록을 선택하십시오.</div>
        </main>
    </div>

    <script src="config.js"></script>
    <script>
        function grantAccess() {
            localStorage.setItem('slm_verified', 'true');
            document.getElementById('auth-overlay').style.display = 'none';
            initSupabase();
        }

        let supabase;
        async function initSupabase() {
            if (typeof CONFIG === 'undefined') return;
            supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            // 카테고리 로드
            const { data } = await supabase.from('categories').select('*').eq('is_visible', true).order('display_order');
            const nav = document.getElementById('category-nav');
            nav.innerHTML = '<p style="font-size:0.7rem; color:var(--brass); opacity:0.5; margin-bottom:1.5rem;">ARCHIVE</p>';
            data?.forEach(c => {
                const div = document.createElement('div');
                div.style = "margin-bottom:1.2rem; cursor:pointer; font-size:0.9rem; opacity:0.8;";
                div.innerHTML = `<span style="color:var(--brass)">#</span> ${c.name}`;
                div.onclick = () => loadPosts(c.id, c.name);
                nav.appendChild(div);
            });
        }

        window.onload = () => {
            if (localStorage.getItem('slm_verified') === 'true') {
                document.getElementById('auth-overlay').style.display = 'none';
                initSupabase();
            }
        };
    </script>
</body>
</html>
