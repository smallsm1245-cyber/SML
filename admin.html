<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Dashboard - SMALLSM Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
    <div id="loginScreen" class="login-screen">
        <div class="login-panel">
            <h2 class="login-title">🎬 관리자 로그인</h2>
            <div class="form-group">
                <label>이메일</label>
                <input type="email" id="loginEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button id="loginBtn" class="btn-primary">로그인</button>
            <p id="loginError" class="error-message"></p>
            <p class="back-link"><a href="index.html">← 메인으로 돌아가기</a></p>
        </div>
    </div>

    <div id="adminDashboard" class="admin-dashboard" style="display: none;">
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="dashboard-title">📚 SMALLSM Archive</h1>
                <span class="admin-badge">관리자 모드</span>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="다크모드 전환">
                    <span class="icon">🌙</span>
                </button>
                <button class="btn-secondary" id="logoutBtn">로그아웃</button>
            </div>
        </header>

        <div class="dashboard-container">
            <aside class="dashboard-sidebar">
                <nav class="sidebar-nav">
                    <button class="nav-item active" data-section="overview">
                        <span class="icon">📊</span><span class="text">대시보드</span>
                    </button>
                    <button class="nav-item" data-section="home">
                        <span class="icon">🏠</span><span class="text">홈 화면 관리</span>
                    </button>
                    <button class="nav-item" data-section="posts">
                        <span class="icon">📝</span><span class="text">게시글 관리</span>
                        <span class="badge" id="postCount">0</span>
                    </button>
                    <button class="nav-item" data-section="categories">
                        <span class="icon">📂</span><span class="text">카테고리</span>
                    </button>
                    <button class="nav-item" data-section="trash">
                        <span class="icon">🗑️</span><span class="text">휴지통</span>
                        <span class="badge warning" id="trashCount">0</span>
                    </button>
                    <button class="nav-item" data-section="settings">
                        <span class="icon">⚙️</span><span class="text">설정</span>
                    </button>
                </nav>
            </aside>

            <main class="dashboard-main">
                <section id="section-overview" class="content-section active">
                    <h2 class="section-title">📊 대시보드</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📝</div>
                            <div class="stat-info"><p>총 게시물</p><p class="stat-value" id="statTotalPosts">0</p></div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📂</div>
                            <div class="stat-info"><p>카테고리</p><p class="stat-value" id="statCategories">0</p></div>
                        </div>
                    </div>
                </section>

                <section id="section-home" class="content-section">
                    <h2 class="section-title">🏠 홈 화면 관리</h2>
                    <div class="split-layout">
                        <div class="editor-panel">
                            <div class="card">
                                <div class="form-group"><label>메인 제목</label><input type="text" id="homeTitle" class="form-input"></div>
                                <div class="form-group"><label>부제목</label><input type="text" id="homeSubtitle" class="form-input"></div>
                                <div class="form-group"><label>본문</label><textarea id="homeContent" class="form-textarea" rows="10"></textarea></div>
                                <button class="btn-primary" id="saveHomeBtn">💾 저장하기</button>
                            </div>
                        </div>
                        <div class="preview-panel">
                            <div class="preview-header"><span>실시간 미리보기</span></div>
                            <div class="preview-content" id="homePreview">
                                <h1 id="previewTitle">환영합니다</h1>
                                <p class="preview-subtitle" id="previewSubtitle"></p>
                                <div class="preview-body" id="previewContent"></div>
                            </div>
                        </div>
                    </div>
                </section>

                </main>
        </div>
    </div>

    <script src="/api/config"></script>
    <script src="js/admin.js"></script>
</body>
</html>
