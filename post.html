<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index, follow">

    <title id="pageTitle">게시물 - SMALLSM Archive</title>
    <meta name="description" content="SMALLSM Archive의 기록">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            900: '#0f172a',
                            950: '#020617',
                        },
                        rose: {
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
            // Age verification & Dark mode check (same as index.html)
            (function () {
                const verified = localStorage.getItem('age_verified');
                if (verified) {
                    const timestamp = parseInt(verified);
                    const VERIFICATION_DURATION = 24 * 60 * 60 * 1000;
                    if (Date.now() - timestamp < VERIFICATION_DURATION) {
                        document.documentElement.classList.add('verified');
                        document.write('<style>#disclaimerOverlay { display: none !important; } .content-blur { filter: none !important; pointer-events: auto !important; }</style>');
                    }
                }
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                } else {
                    document.documentElement.classList.remove('dark')
                }
            })();
    </script>
</head>

<body
    class="bg-neutral-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans selection:bg-rose-600/20 transition-colors duration-300">
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-md px-6">
        <div
            class="bg-white dark:bg-slate-900 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl border border-slate-200 dark:border-slate-800">
            <h2 class="text-2xl font-bold mb-4 font-serif text-rose-600">성인 인증</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
                귀하는 만 19세 이상이십니까?
            </p>
            <div class="flex flex-col gap-3">
                <button
                    class="w-full py-4 bg-rose-600 text-white rounded-xl font-bold hover:bg-rose-700 transition-colors"
                    id="btnYes">예 (19세 이상)</button>
                <button
                    class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                    id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Sticky Header & Progress Bar -->
    <header id="mainHeader"
        class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-transform duration-300">
        <div class="max-w-screen-md mx-auto h-16 flex items-center justify-between px-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="p-2 -ml-2 text-slate-600 dark:text-slate-400 block lg:hidden"
                    aria-label="Home">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
                <h1 class="text-lg font-bold font-serif tracking-tight text-rose-600 line-clamp-1">
                    <a href="index.html">SML ARCHIVE</a>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="headerModeToggle" class="p-2 text-slate-600 dark:text-slate-400" aria-label="Toggle Mode">
                    <i data-lucide="moon" class="dark:hidden w-5 h-5"></i>
                    <i data-lucide="sun" class="hidden dark:block w-5 h-5"></i>
                </button>
            </div>
        </div>
        <div class="h-0.5 w-full bg-slate-100 dark:bg-slate-900 overflow-hidden">
            <div id="readingProgress" class="h-full bg-rose-600 transition-all duration-150" style="width: 0%"></div>
        </div>
    </header>

    <!-- Content Area -->
    <div id="appContainer" class="max-w-screen-md mx-auto pt-20 pb-24 px-4 min-h-screen transition-all duration-300">
        <main class="space-y-8">
            <article class="py-6">
                <header class="mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                    <h1 id="postTitle" class="text-3xl font-bold font-serif mb-3 leading-tight">로딩 중...</h1>
                    <div id="postMeta"
                        class="flex flex-wrap items-center gap-x-3 gap-y-1 text-slate-500 text-xs font-semibold tracking-wide uppercase">
                        <span id="postCategory" class="text-rose-600">Category</span>
                        <span class="w-1 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></span>
                        <span id="postDate">Date</span>
                    </div>
                </header>

                <!-- Wiki Body -->
                <div id="postContent"
                    class="prose prose-slate dark:prose-invert max-w-none leading-relaxed font-serif text-lg selection:bg-rose-600/20">
                    <div class="flex flex-col items-center py-20 gap-4">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-rose-600"></div>
                        <p class="text-slate-400 text-sm italic">기록을 불러오는 중...</p>
                    </div>
                </div>
            </article>

            <!-- Bottom Navigation Sync -->
            <div id="settingsView" class="hidden space-y-8 py-4">
                <h2 class="text-2xl font-bold font-serif mb-6">Settings</h2>
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">비상탈출 (Quick Exit)
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm block mb-2 text-slate-500">위장 URL</label>
                                <input type="text" id="escapeUrlInput"
                                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-rose-600/50 transition-colors"
                                    placeholder="https://www.google.com">
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://www.google.com">Google</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://ko.wikipedia.org">Wikipedia</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://news.naver.com">News</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Utility Bar (Wiki Style) -->
    <div id="utilityBar"
        class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[40] flex items-center bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-full shadow-xl border border-slate-200 dark:border-slate-800 px-2 py-2 gap-1 transition-all duration-300 transform scale-0 opacity-0 lg:scale-100 lg:opacity-100">
        <button id="btnTextSize" class="p-3 text-slate-600 dark:text-slate-400 hover:text-rose-600 transition-colors"
            title="글자 크기">
            <i data-lucide="type" class="w-5 h-5"></i>
        </button>
        <button id="btnShare" class="p-3 text-slate-600 dark:text-slate-400 hover:text-rose-600 transition-colors"
            title="공유하기">
            <i data-lucide="share-2" class="w-5 h-5"></i>
        </button>
        <button id="btnEmergency" class="p-3 text-rose-600 hover:scale-110 transition-transform" title="긴급 탈출">
            <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
        </button>
    </div>

    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 safe-area-bottom">
        <div class="max-w-screen-md mx-auto grid grid-cols-4 h-20 items-center">
            <a href="index.html" class="nav-item flex flex-col items-center justify-center gap-1 text-slate-400"
                id="navHome">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">홈</span>
            </a>
            <a href="index.html#wiki" class="nav-item flex flex-col items-center justify-center gap-1 text-slate-400"
                id="navWiki">
                <i data-lucide="book-open" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">위키</span>
            </a>
            <a href="index.html#search" class="nav-item flex flex-col items-center justify-center gap-1 text-slate-400"
                id="navSearch">
                <i data-lucide="search" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">검색</span>
            </a>
            <button class="nav-item flex flex-col items-center justify-center gap-1 text-slate-400" id="navSettings">
                <i data-lucide="settings" class="w-6 h-6"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">설정</span>
            </button>
        </div>
    </nav>

    <!-- Sidebar / Drawer (Minimal for Post) -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 z-[100] bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-300 lg:hidden">
        <div class="h-full flex flex-col p-6">
            <h1 class="text-2xl font-bold font-serif text-rose-600 mb-8">SMALLSM</h1>
            <nav class="flex-1 overflow-y-auto">
                <ul id="categoryNav" class="space-y-1">
                    <!-- Loaded dynamically -->
                </ul>
            </nav>
        </div>
    </aside>
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300">
    </div>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="/api/config" async></script>
    <script src="js/post.js"></script>
    <script src="js/admin-inline.js"></script>
</body>

</html>
