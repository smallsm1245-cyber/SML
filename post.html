<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index, follow">

    <title id="pageTitle">게시물 - SMALLSM Archive</title>
    <meta name="description" content="SMALLSM Archive의 기록">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            900: '#1a1a1a',
                            950: '#121212',
                        },
                        brand: {
                            primary: '#B68D40',
                            accent: '#D4A574',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    borderRadius: {
                        'brand': '8px',
                    },
                    lineHeight: {
                        relaxed: '1.85',
                    }
                }
            }
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=20260226">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
            // Age verification & Dark mode check (same as index.html)
            (function () {
                const verified = localStorage.getItem('age_verified');
                if (verified) {
                    const timestamp = parseInt(verified);
                    const VERIFICATION_DURATION = 24 * 60 * 60 * 1000;
                    if (Date.now() - timestamp < VERIFICATION_DURATION) {
                        document.documentElement.classList.add('verified');
                        document.write('<style>#disclaimerOverlay { display: none !important; } .content-blur { filter: none !important; pointer-events: auto !important; }</style>');
                    }
                }
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                } else {
                    document.documentElement.classList.remove('dark')
                }
            })();
    </script>
</head>

<body
    class="bg-[#F5F6F7] dark:bg-black text-[#373A3C] dark:text-slate-100 font-serif selection:bg-brand-primary/20 transition-colors duration-300">
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-md px-6">
        <div
            class="bg-white dark:bg-slate-900 p-8 rounded-lg max-w-sm w-full text-center shadow-2xl border border-slate-200 dark:border-slate-800">
            <h2 class="text-2xl font-bold mb-4 font-serif text-brand-primary">성인 인증</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
                귀하는 만 19세 이상이십니까?
            </p>
            <div class="flex flex-col gap-3">
                <button
                    class="w-full py-4 bg-brand-primary text-[#000] rounded-lg font-bold hover:bg-brand-primary/80 transition-colors"
                    id="btnYes">예 (19세 이상)</button>
                <button
                    class="w-full py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-lg font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                    id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Mobile Sticky Header -->
    <header class="mobile-header lg:hidden">
        <div class="header-left">
            <button id="menuToggleBtnMobile"
                class="p-2 text-brand-primary hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors flex items-center justify-center lg:hidden"
                aria-label="Menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="mobile-logo ml-2 font-serif font-bold text-brand-primary tracking-tight">
                <a href="index.html">SMALLSM</a>
            </div>
        </div>
        <div class="header-right">
            <button id="headerModeToggle"
                class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-lg transition-colors">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Global Floating Menu Button (for Desktop) -->
    <button id="menuToggleBtn"
        class="fixed top-3 left-3 z-[10001] p-3 text-brand-primary hover:scale-110 active:scale-95 transition-all hidden lg:flex items-center justify-center bg-white/10 backdrop-blur-md rounded-full border border-white/10 shadow-lg gap-2"
        aria-label="Menu">
        <i data-lucide="menu" class="block w-6 h-6" style="stroke-width: 2.5px;"></i>
        <span class="text-[10px] font-bold tracking-tighter hidden xl:block">MENU</span>
    </button>

    <!-- Sidebar / Drawer -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 w-72 z-[10000] bg-white dark:bg-black border-r border-slate-200 dark:border-slate-800 transform -translate-x-full transition-transform duration-300 ease-in-out hidden">
        <div class="h-full flex flex-col p-6">
            <h1 class="text-2xl font-bold font-serif text-brand-primary mb-8">SMALLSM</h1>
            <nav class="flex-1 overflow-y-auto">
                <ul id="categoryNav" class="space-y-1 mb-8">
                    <!-- Loaded dynamically -->
                </ul>
                <div class="pt-6 border-t border-slate-200 dark:border-slate-800 space-y-2">
                    <button id="sidebarSettingsBtn"
                        class="w-full flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-lg transition-colors text-left">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span class="font-medium">설정 (Settings)</span>
                    </button>
                </div>
            </nav>
        </div>
    </aside>

    <!-- Scrim-like Overlay for Menu -->
    <div id="sidebarOverlay"
        class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[9998] hidden opacity-0 transition-opacity duration-300">
    </div>

    <!-- Content Area -->
    <div id="appContainer"
        class="max-w-screen-xl mx-auto pt-2 pb-8 px-4 md:px-6 min-h-screen transition-all duration-300">
        <main class="space-y-4">
            <article class="pt-0 pb-4">
                <header class="mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <h1 id="postTitle" class="text-2xl font-bold font-serif mb-2 leading-tight">로딩 중...</h1>
                    <div id="postMeta"
                        class="flex flex-wrap items-center gap-x-3 gap-y-1 text-slate-500 text-xs font-semibold tracking-wide uppercase">
                        <span id="postCategory" class="text-brand-primary">Category</span>
                        <span class="w-1 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></span>
                        <span id="postDate">Date</span>
                    </div>
                </header>

                <!-- Wiki Body -->
                <div id="postContent"
                    class="prose prose-slate dark:prose-invert max-w-none leading-relaxed font-serif text-lg selection:bg-brand-primary/20">
                    <div class="flex flex-col items-center py-20 gap-4">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-primary"></div>
                        <p class="text-slate-400 text-sm italic">기록을 불러오는 중...</p>
                    </div>
                </div>
            </article>

            <!-- Bottom Navigation Sync -->
            <div id="settingsView" class="hidden space-y-8 py-4">
                <h2 class="text-2xl font-bold font-serif mb-6">Settings</h2>
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-6 space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">비상탈출 (Quick Exit)
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm block mb-2 text-slate-500">위장 URL</label>
                                <input type="text" id="escapeUrlInput"
                                    class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-4 py-3 outline-none focus:border-brand-primary/50 transition-colors"
                                    placeholder="https://www.google.com">
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://www.google.com">Google</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://ko.wikipedia.org">Wikipedia</button>
                                <button
                                    class="preset-btn px-4 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-xs font-semibold"
                                    data-url="https://news.naver.com">News</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer (Copyright & Admin Access) -->
            <footer class="site-footer py-4 mt-8 border-t border-slate-200 dark:border-slate-800 text-center">
                <p id="copyrightText" class="text-xs opacity-50">© 2026 - PRESENT SMALLSM. All Rights Reserved.</p>
            </footer>
        </main>
    </div>




    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="/api/config" async></script>
    <script src="js/post.js"></script>
    <script src="js/admin-inline.js"></script>
</body>

</html>
