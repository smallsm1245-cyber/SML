<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title id="pageTitle">게시물 - SMALLSM Archive</title>
    <meta name="description" content="SMALLSM Archive의 기록">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Age Verification Disclaimer -->
    <div id="disclaimerOverlay" class="disclaimer-overlay">
        <div class="disclaimer-content">
            <h2>성인 인증</h2>
            <p>본 사이트는 성인 지향 콘텐츠를 포함하고 있습니다.<br>
            귀하는 만 19세 이상이십니까?</p>
            <div class="disclaimer-buttons">
                <button class="btn btn-primary" id="btnYes">예 (19세 이상)</button>
                <button class="btn btn-secondary" id="btnNo">아니요</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container content-blur" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">SMALLSM</h1>
                <p class="site-subtitle">CINEMATIC ARCHIVE</p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" 
                       class="search-input" 
                       id="searchInput"
                       placeholder="검색어를 입력하세요...">
            </div>

            <!-- Categories -->
            <nav>
                <ul class="category-nav" id="categoryNav">
                    <!-- Dynamically loaded -->
                </ul>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <button class="mode-toggle" id="modeToggle">
                    <span>🌙</span>
                    <span>Night Library</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-panel">
                <h1 class="post-title" id="postTitle">로딩 중...</h1>
                <div class="post-meta" id="postMeta">
                    <span id="postCategory"></span> • <span id="postDate"></span>
                </div>
                <div class="post-content" id="postContent">
                    <p>게시물을 불러오는 중입니다...</p>
                </div>
            </div>

            <!-- Footer -->
            <footer class="site-footer">
                <p id="copyrightText">© 2026 - PRESENT SMALLSM. All Rights Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/api/config"></script>
    <script src="js/post.js"></script>
</body>
</html>
